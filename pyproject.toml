[project]
name = "glossarian"
version = "0.1.0"
description = "Parse, model, and lint a deterministically-structured, GitHub-anchor-faithful markdown glossary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
glossarian-check = "glossarian.cli:check"
glossarian-gather = "glossarian.cli:gather"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glossarian"]

[dependency-groups]
dev = [
    "mypy>=1.9",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
